name: P5 shared API and ERP acceptance

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: qc_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: final_hack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qc_test -d final_hack_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://qc_test:isolated-ci-only@localhost:5432/final_hack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
