name: Role 2 contract and scenario checks
on:
  push:
  pull_request:
jobs:
  role2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Python transport DTOs
        run: |
          python -m pip install -r contracts/requirements.codegen.txt
          datamodel-codegen --input contracts/openapi.yaml --input-file-type openapi --output contracts/generated/models.py --output-model-type pydantic_v2.BaseModel --target-python-version 3.11 --disable-timestamp
          git diff --exit-code -- contracts/generated/models.py
          python -m unittest discover -s contracts -p 'test_*.py' -v
      - name: Build frontend and check generated TypeScript
        working-directory: frontend
        run: |
          npm ci
          npm run generate:types
          git diff --exit-code -- src/generated/api.ts
          npm run check:compat
          npm run test:compat
          npm run build
      - name: Check synthetic scenarios and emulator
        run: |
          python emulator/generate.py --seed 2026
          git diff --exit-code -- data/scenarios.json data/expected.json
          python -m unittest discover -s emulator -p 'test_*.py' -v
          python -m unittest discover -s integrations -p 'test_*.py' -v
          python -m compileall -q emulator integrations
