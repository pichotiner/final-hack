name: efqa-erp
services:
  erp:
    build: {context: ../.., dockerfile: deploy/Dockerfile.emulator}
    user: "${QC_UID:-10001}:${QC_GID:-10001}"
    volumes:
      - ${QC_NODE_DIR:?Set absolute node bundle path}/state:/state
      - ${QC_NODE_DIR}/erp.token:/run/erp.token:ro
    networks: [local]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 2s
      timeout: 5s
      retries: 60
  erp-tls:
    build: {context: ../.., dockerfile: deploy/Dockerfile.tls-proxy}
    volumes:
      - ${QC_NODE_DIR}/tls:/run/tls:ro
      - ../nginx.tls-erp.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${QC_BIND_ADDRESS:-127.0.0.1}:${QC_ERP_PORT:-8443}:8443"]
    networks: [local]
    depends_on:
      erp: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /run/tls/ca.crt, https://localhost:8443/health]
      interval: 2s
      timeout: 5s
      retries: 60
networks:
  local: {}
