openapi: 3.1.0
info:
  title: EFQA synthetic ERP receiver — DP-01
  version: 0.3.0
  description: 'Our emulator contract, NOT a vendor 1C API. Full snapshots, persistent application ACK. No physical actions.'
servers: [{url: 'http://127.0.0.1:8090'}]
security: [{bearerAuth: []}]
paths:
  /external/v2/work-orders:
    get:
      operationId: fetchWorkOrders
      parameters: [{name: cursor, in: query, schema: {type: integer, minimum: 0, default: 0}}]
      responses:
        '200': {description: Synthetic work orders, content: {application/json: {schema: {$ref: '#/components/schemas/WorkOrderPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /external/v2/quality-results:
    post:
      operationId: submitQualityResult
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QualityResult'}}}}
      responses:
        '201': {description: Atomic inbox and state commit, content: {application/json: {schema: {$ref: '#/components/schemas/Ack'}}}}
        '200': {description: Exact duplicate with initial receipt fields, content: {application/json: {schema: {$ref: '#/components/schemas/Ack'}}}}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /external/v2/quality-results/{message_id}:
    get:
      operationId: getSavedResult
      parameters: [{name: message_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '200': {description: Original message and commit receipt, content: {application/json: {schema: {$ref: '#/components/schemas/SavedResult'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /external/v2/quality-state:
    get:
      operationId: getQualityState
      parameters:
        - {name: producer_id, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
        - {name: external_system, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
        - {name: external_order_id, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
        - {name: external_item_id, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
      responses:
        '200': {description: Current snapshot and visible history gaps, content: {application/json: {schema: {$ref: '#/components/schemas/QualityState'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Error: {description: Rejected; not an ACK, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    Id: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
    QualityResult:
      type: object
      additionalProperties: false
      required: [producer_id, external_system, external_order_id, external_item_id, message_id, result_version, previous_message_id, context_revision, control_cycle_id, disposition, release_allowed_now, blockers, review_required, confirmed_nonconformities]
      properties:
        <<: &Stream
          producer_id: {$ref: '#/components/schemas/Id'}
          external_system: {$ref: '#/components/schemas/Id'}
          external_order_id: {$ref: '#/components/schemas/Id'}
          external_item_id: {$ref: '#/components/schemas/Id'}
        message_id: {$ref: '#/components/schemas/Id'}
        result_version: {type: integer, minimum: 1}
        previous_message_id: {type: [string, 'null'], minLength: 1}
        context_revision: {type: integer, minimum: 0}
        control_cycle_id: {$ref: '#/components/schemas/Id'}
        disposition: {type: string, enum: [pending, released, rework, rejected]}
        release_allowed_now: {type: boolean}
        blockers: {type: array, items: {type: string}}
        review_required: {type: boolean}
        confirmed_nonconformities: {type: array, items: {$ref: '#/components/schemas/ConfirmedCard'}}
    ConfirmedCard:
      type: object
      additionalProperties: false
      required: [nonconformity_id, resolution_status, decision_id, resolution_id, cause_status, cause_category, basis_ids]
      properties:
        nonconformity_id: {$ref: '#/components/schemas/Id'}
        resolution_status: {type: string, enum: [open, resolved]}
        decision_id: {$ref: '#/components/schemas/Id'}
        resolution_id: {type: [string, 'null'], minLength: 1}
        cause_status: {type: string, enum: [unresolved, hypothesis, established]}
        cause_category: {type: string, enum: [incoming, equipment, operator, other, unknown]}
        basis_ids: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Id'}}
    Ack:
      type: object
      additionalProperties: false
      required: [producer_id, external_system, external_order_id, external_item_id, message_id, result_version, content_digest, status, application_status, received_at, current_version_at_accept]
      properties:
        <<: *Stream
        message_id: {$ref: '#/components/schemas/Id'}
        result_version: {type: integer, minimum: 1}
        content_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {type: string, enum: [accepted, duplicate]}
        application_status: {type: string, enum: [applied, superseded]}
        received_at: {type: string, format: date-time}
        current_version_at_accept: {type: integer, minimum: 1}
    SavedResult:
      type: object
      required: [body, ack]
      properties:
        body: {$ref: '#/components/schemas/QualityResult'}
        ack: {$ref: '#/components/schemas/Ack'}
    QualityState:
      type: object
      required: [current, missing_version_ranges]
      properties:
        current: {$ref: '#/components/schemas/SavedResult'}
        missing_version_ranges:
          type: array
          items:
            type: object
            required: [from_version, to_version]
            properties:
              from_version: {type: integer, minimum: 1}
              to_version: {type: integer, minimum: 1}
    WorkOrder:
      type: object
      required: [message_id, external_order_id, revision, item_ids, item_type_id, route_id, route_version, control_plan_version, checkpoints, components]
      properties:
        message_id: {$ref: '#/components/schemas/Id'}
        external_order_id: {$ref: '#/components/schemas/Id'}
        revision: {type: integer, minimum: 1}
        item_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
        item_type_id: {$ref: '#/components/schemas/Id'}
        route_id: {$ref: '#/components/schemas/Id'}
        route_version: {$ref: '#/components/schemas/Id'}
        control_plan_version: {$ref: '#/components/schemas/Id'}
        checkpoints:
          type: array
          minItems: 1
          items:
            type: object
            required: [checkpoint_id, region_id, method_version, repeat_after_rework]
            properties:
              checkpoint_id: {$ref: '#/components/schemas/Id'}
              region_id: {$ref: '#/components/schemas/Id'}
              method_version: {$ref: '#/components/schemas/Id'}
              repeat_after_rework: {type: boolean}
        components: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/Id'}}}
    WorkOrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkOrder'}}
        next_cursor: {type: [string, 'null']}
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        request_id: {type: string}
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: string}}
