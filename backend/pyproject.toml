[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "final-hack-backend"
version = "0.1.0"
description = "Production quality event journal and domain services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "alembic>=1.16,<2",
    "cryptography>=46,<49",
    "psycopg[binary]>=3.2,<4",
    "rfc8785>=0.1,<1",
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.api" = ["contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a disposable PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
